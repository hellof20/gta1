apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gta1-vllm
  namespace: gta1
spec:
  scaleTargetRef:
    name: gta1-vllm
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 1
            periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 300
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
      query: sum(gta1_inflight_requests)
      threshold: "2"
      ignoreNullValues: "true"
