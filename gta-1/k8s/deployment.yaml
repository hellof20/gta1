apiVersion: apps/v1
kind: Deployment
metadata:
  name: gta1
  namespace: gta1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gta1
  template:
    metadata:
      labels:
        app: gta1
    spec:
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache

      initContainers:
        - name: download-model
          image: gcr.io/cloud-builders/gsutil
          command:
            - sh
            - -c
            - |
              if [ -f /models/done ]; then
                echo "Model already exists, skipping download."
              else
                echo "Downloading model from GCS..."
                gsutil -m cp -r gs://YOUR_BUCKET/models/GTA1-7B/* /models/
                touch /models/done
                echo "Download complete."
              fi
          volumeMounts:
            - name: model-cache
              mountPath: /models

      containers:
        - name: gta1
          image: asia-southeast1-docker.pkg.dev/YOUR_PROJECT_ID/myrepo/gta1:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /models
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
